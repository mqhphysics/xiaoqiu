<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#183f2a" />
    <title>晓球</title>
    <script>
      <%= htmlWebpackPlugin.options.script %>
    </script>
    <script>
      // Taro sizes the root from the shorter side of the document, so a short
      // desktop window shrinks rem text while the PX chrome stays large.
      // Desktop keeps a stable 40px root. Phones still follow the 750-wide scale.
      ;(function (window) {
        function fitRoot() {
          var width = window.document.documentElement.clientWidth || window.innerWidth || 390
          var size = width >= 721 ? 40 : Math.min(40, Math.max(20, (40 * width) / 750))
          window.document.documentElement.style.fontSize = size + 'px'
        }
        window.addEventListener('resize', fitRoot)
        fitRoot()
      })(window)
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
