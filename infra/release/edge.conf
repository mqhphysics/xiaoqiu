# Beta/dev edge: plain HTTP on :9988 (public) and via cloudflared Quick Tunnel.
# cloudflared reaches us through the Docker bridge, so only that hop may assert
# CF-Connecting-IP; direct :9988 clients keep their real (DNAT-preserved) address.
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Brute-force brake for 6-digit passwords and code endpoints (per client IP).
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
limit_req_status 429;

server {
  listen 80;
  server_name _;
  client_max_body_size 30m;

  location ~ ^/api/auth/(login|email/login|email/code|password/) {
    limit_req zone=auth_login burst=10 nodelay;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
  location / { proxy_pass http://admin-web:80; proxy_set_header Host $host; }
}
